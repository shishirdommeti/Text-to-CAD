# ==========================================
# Model & Dataset 
# ==========================================
# Note: Google officially released Gemma 2 in 9B and 27B sizes. 
# If you are using a specific 12B model (like Mistral Nemo), change the template to 'mistral'.
model_name_or_path: google/gemma-3-12b-pt
dataset: text2cad
template: gemma
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16

# ==========================================
# PiSSA (Parameter-Efficient Fine-Tuning)
# ==========================================
finetuning_type: lora
pissa_init: true
lora_target: all
lora_rank: 64
lora_alpha: 64
lora_dropout: 0

# ==========================================
# Logging & Output
# ==========================================
output_dir: saves/gemma-text2cad/pissa
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

# ==========================================
# Training Hyperparameters
# ==========================================
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
fp16: false

# ==========================================
# DeepSpeed (Multi-GPU Distribution)
# ==========================================
deepspeed: examples/deepspeed/ds_z2_config.json